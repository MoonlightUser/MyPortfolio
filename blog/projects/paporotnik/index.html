<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Barnsley fern | Tymur</title>
</head>

<body>
    <div class="container">
        <input type="number" id="numberInput" min="1" max="10000" step="1" value="5000" aria-label="Number of points (1 to 10000)">
        <button id="startButton">Start</button>
    </div>

    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        #numberInput {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            width: 200px;
        }

        #startButton {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        #startButton:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
    </style>
    <script src="app.js"></script>
</body>

</html>
