# Optional HOST nginx configuration. Add HTTPS using your own certificate.
# Set APP_ORIGIN to the exact public HTTPS origin and COOKIE_SECURE=true.
# Docker is bound to localhost; this proxy runs on the host.
server {
    listen 80;
    server_name localhost;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
